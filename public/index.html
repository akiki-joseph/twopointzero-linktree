  <link rel="icon" type="image/png" href="logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e10600;
      --red-dark: #a80400;
      --black: #0a0a0a;
      --card: #161616;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #9a9a9a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--black);
      background-image:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(225, 6, 0, 0.28), transparent 70%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 14px);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px 32px;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      margin-bottom: 26px;
    }

    .logo img {
      display: block;
      width: 170px;
      height: auto;
      filter: drop-shadow(0 0 28px rgba(225, 6, 0, 0.45));
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 46px;
      letter-spacing: 3px;
      line-height: 1;
    }

    h1 span { color: var(--red); }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 18px 0 30px;
    }

    .tags span {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #cfcfcf;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn:hover { transform: translateY(-2px); border-color: var(--red); }
    .btn:active { transform: scale(0.98); }

    .btn .icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
    }

    .btn .icon svg { width: 22px; height: 22px; fill: currentColor; }

    .btn .label { flex: 1; text-align: left; }
    .btn .label small {
      display: block;
      font-weight: 400;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn .arrow { opacity: 0.6; font-size: 18px; }

    .btn.primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border-color: var(--red);
      box-shadow: 0 8px 28px rgba(225, 6, 0, 0.35);
    }

    .btn.primary .icon { background: rgba(0,0,0,0.2); }
    .btn.primary .label small { color: rgba(255,255,255,0.85); }

    .btn.soon {
      opacity: 0.45;
      pointer-events: none;
      border-style: dashed;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #5c5c5c;
    }
  </style>
</head>

  <script>
    (function () {
      function send(data) {
        var body = JSON.stringify(data);
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/track', new Blob([body], { type: 'text/plain' }));
        } else {
          fetch('/api/track', { method: 'POST', body: body, keepalive: true });
        }
      }
      send({ type: 'view', referrer: document.referrer });
      document.querySelectorAll('[data-track]').forEach(function (el) {
        el.addEventListener('click', function () {
          send({ type: 'click', link: el.getAttribute('data-track') });
        });
      });
    })();
  </script>
